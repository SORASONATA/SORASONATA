
name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg

          user: YOUR_USERNAME
          template: classic
          base: header, activity, community, repositories, metadata

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14
          plugin_habits_from: 200

          plugin_languages: yes
          plugin_languages_analysis_timezone: Asia/Bangkok
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8

          plugin_achievements: yes
          plugin_achievements_threshold: C

          plugin_projects: yes

          # ===== PageSpeed Insights (ต้องมีเว็บไซต์ของตัวเอง) =====
          # ลบ comment 3 บรรทัดล่างนี้ออก แล้วใส่ URL เว็บของนาย ถ้าอยากได้ส่วนนี้ด้วย
          # plugin_pagespeed: yes
          # plugin_pagespeed_url: https://your-website.com
          # plugin_pagespeed_detailed: yes

          # ===== เพลงแนะนำจาก Apple Music / Spotify (ต้องผูก token เพิ่ม) =====
          # plugin_music: yes
          # plugin_music_provider: apple

          config_timezone: Asia/Bangkok
